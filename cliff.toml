# git-cliff configuration — Etzian default (Keep a Changelog layout).
# Source: _foundation/claude-plugin/skills/release/cliff.toml
# Copied into each repo by etzian:release; adapt locally only when needed.

[changelog]
header = """
# Changelog

All notable changes to this project are documented here.
The format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/)
and the project uses [Semantic Versioning](https://semver.org/).

"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first }}{% if commit.breaking %} (**breaking**){% endif %}
{% endfor %}
{%- endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
# Phase commits were once written `feat(m8) P3: slice`, which is not a valid
# Conventional Commit. Rewrite them to `feat(m8): P3 slice` before parsing.
commit_preprocessors = [
  { pattern = '^(\w+)\(([^)]+)\) (P[0-9][0-9a-z]*): ', replace = "${1}(${2}): ${3} " },
]
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^(feat)", group = "<!-- 0 -->Added" },
  { message = "^(fix)", group = "<!-- 1 -->Fixed" },
  { message = "^(perf|refactor)", group = "<!-- 2 -->Changed" },
  { message = "^(revert)", group = "<!-- 3 -->Removed" },
  { body = ".*security", group = "<!-- 4 -->Security" },
  { message = "^(docs)", group = "<!-- 5 -->Documentation" },
  { message = "^(test|ci|build|style|chore)", skip = true },
  { message = ".*", group = "<!-- 6 -->Other" },
]

[bump]
initial_tag = "v0.1.0"
features_always_bump_minor = true
breaking_always_bump_major = false
